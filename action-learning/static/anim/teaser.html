<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAP Overview Animation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans|Castoro">
<link rel="stylesheet" href="../css/fig.css">
</head>
<body>
<main id="fig" role="img" aria-label="Animated overview of LEAP. Observed paths climb over the barrier from A to B. Reference paths loosely follow their average, and about half pass through the barrier. LEAP learns the path log ratio between them from complete paths. Minimizing the learned action from a reference path that grazes the barrier lifts it onto the representative trajectory."></main>
<div class="seg" id="chips"></div>
<div class="controls" id="controls"></div>
<script src="../js/fig.js"></script>
<script src="../js/toy.js"></script>
<script src="../data/toy.js"></script>
<script src="../data/toy_paths.js"></script>
<script src="../data/toy_leap.js"></script>
<script src="../data/landscape.js"></script>
<script src="../js/landscape.js"></script>
<script>
(() => {
  'use strict';
  const { P, el, rich, setRich, stage, polyline, dot, loop, playButton, smooth, clamp } = Fig;
  const W = 1000, H = 545;
  const host = document.getElementById('fig');
  const st = stage(host, W, H, () => draw());
  const ground = window.LEAP_TOY_GROUND;
  const T = LEAPToy.make(ground);
  const TL = LEAPToy.make(ground, { field: window.LEAP_TOY_FIELD });   // the action LEAP learned (build/toy_leap.py)
  const R = LEAPToy.rng(11);
  const [A, B] = T.ends();
  const N = T.params.N, D = T.params.D;

  // Landscape of Figs. 1-3 in the logical frame.
  const k = W / ground.L, oy = 88;
  const X = (u) => u * ground.L * k;
  const Y = (h) => oy + (ground.y_ref - h * ground.L - ground.crop_top) * k;
  Landscape.draw(st.bg, k, 0, oy, (H - oy) / k + 4);        // ground fills to the figure's bottom edge

  // Observed paths: Metropolis-Hastings samples of the toy dynamics between A and B, kept above the curve.
  // Reference paths: the reference LEAP was trained with, Brownian motion with the data's diffusion around randomly
  // raised or lowered copies of the average observed path. It knows nothing of the drift or the barrier, so many of its
  // paths cut through the barrier while others pass far above it.
  const data = window.LEAP_TOY_PATHS.paths.map((p) => Float64Array.from(p));
  const MEAN = window.LEAP_TOY_FIELD.mean_path, OFF = window.LEAP_TOY_FIELD.offset || { mu: 0, sd: 0 };
  const refPath = () => { const z = T.bridge([0, 0], [0, 0], N, R, D), c = OFF.mu + OFF.sd * R.normal(), q = new Float64Array(2 * (N + 1));
    for (let i = 0; i <= N; i++) { q[2 * i] = MEAN[2 * i] + z[2 * i]; q[2 * i + 1] = MEAN[2 * i + 1] + z[2 * i + 1] + c * Math.sin(Math.PI * i / N) ** 2; }
    return q; };
  const refPaths = Array.from({ length: 24 }, refPath);
  const ub = ground.bump_px / ground.L;
  const under = (q) => { let m = 0; for (let i = 0; i <= N; i++) if (Math.abs(q[2 * i] - ub) < 0.12) m = Math.max(m, T.ground_h(q[2 * i]) - q[2 * i + 1]); return m; };
  const dips = refPaths.filter((q) => under(q) > 0.01), over = refPaths.filter((q) => T.aboveGround(q));
  const high = over.filter((q) => q[N + 1] > MEAN[N + 1] + 0.035);
  const toXY = (p) => { const n = p.length / 2, xs = new Float64Array(n), ys = new Float64Array(n);
    for (let i = 0; i < n; i++) { xs[i] = X(p[2 * i]); ys[i] = Y(p[2 * i + 1]); } return [xs, ys]; };
  const firstData = [0, 4, 8, 13].map((i) => toXY(data[i]));
  const firstRefs = [dips[0], high[0] || over[0], dips[1], over[0] === high[0] ? over[1] : over[0]].map(toXY);
  // Stage 2, as in training: one complete observed path against K reference paths with the same endpoints.
  const batches = [];
  for (let bi = 0; bi < 6; bi++) batches.push({ obs: toXY(data[(bi * 5 + 2) % data.length]), refs: [0, 1, 2, 3].map(() => toXY(refPath())) });

  // Stage 3: descend the learned action from one reference path.
  let rep, repXY, opt = {};
  const repSeed = dips[1];
  function resetRep() { rep = Float64Array.from(repSeed); opt = {}; repXY = toXY(rep); }
  resetRep();

  const svg = st.svg;
  const cap1 = rich(svg, 16, 84, '', { class: 'cap cap-em' });
  const cap2 = rich(svg, 16, 108, '', { class: 'cap' });
  const lab = el('g', {}, svg);
  const tagRef = rich(lab, 0, 0, 'reference paths', { class: 'tick halo', 'text-anchor': 'middle', fill: P.ref });
  const tagObs = rich(lab, 0, 0, 'observed paths', { class: 'tick halo', 'text-anchor': 'middle', fill: P.data });

  const STAGES = [
    { name: 'Reference Paths', t0: 0 },
    { name: 'Learning on Paths', t0: 8 },
    { name: 'LEAP Action', t0: 15.8 },
  ];
  const DUR = 23;
  const chips = document.getElementById('chips');
  let clockT = 0, capKey = '';
  const chipEls = STAGES.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.name;
    b.addEventListener('click', () => { clockT = s.t0 + 0.001; if (i === 2) resetRep(); draw(); });
    chips.appendChild(b);
    return b;
  });
  function caption(a, b) {
    if (a + '|' + b === capKey) return;
    capKey = a + '|' + b;
    setRich(cap1, a);
    setRich(cap2, b);
  }
  const partial = (xy, f) => Math.max(2, Math.round(f * xy[0].length));
  function tag(t, x, y, a) { t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('opacity', a); }

  function draw() {
    const t = clockT, ctx = st.ctx;
    st.clear();
    const s = t < STAGES[1].t0 ? 0 : t < STAGES[2].t0 ? 1 : 2;
    chipEls.forEach((c, i) => c.setAttribute('aria-current', i === s ? 'step' : 'false'));
    let aObs = 0, aRef = 0;

    if (s === 0) {
      firstData.forEach((xy, i) => {
        const f = clamp((t - 0.3 - 0.55 * i) / 2.2);
        if (f <= 0) return;
        const n = partial(xy, smooth(f));
        polyline(ctx, xy[0], xy[1], n, { color: P.data, width: 1.8 });
        if (f < 1) dot(ctx, xy[0][n - 1], xy[1][n - 1], 3.8, P.data, '#fff', 1);
      });
      aObs = smooth((t - 2.2) / 0.6);
      firstRefs.forEach((xy, i) => {
        const f = clamp((t - 4.1 - 0.5 * i) / 1.8);
        if (f <= 0) return;
        const n = partial(xy, smooth(f));
        polyline(ctx, xy[0], xy[1], n, { color: P.ref, width: 1.4, dash: [5, 3.5] });
        if (f < 1) dot(ctx, xy[0][n - 1], xy[1][n - 1], 3.4, P.ref, '#fff', 1);
      });
      aRef = smooth((t - 5.6) / 0.6);
      if (t < 4.1) caption('We observe trajectories from simulation, which climb over the barrier from A to B.',
        'LEAP never sees the dynamics behind these samples.');
      else caption('The reference is Brownian motion spread around the average observed path.', '');
    } else if (s === 1) {
      const u = t - STAGES[1].t0, per = 1.3, bi = Math.floor(u / per) % batches.length, ph = (u % per) / per;
      const a = Math.min(smooth(ph / 0.12), 1 - smooth((ph - 0.88) / 0.12));
      const bt = batches[bi];
      bt.refs.forEach((xy) => polyline(ctx, xy[0], xy[1], xy[0].length, { color: P.ref, width: 1.4, dash: [5, 3.5], alpha: 0.95 * a }));
      polyline(ctx, bt.obs[0], bt.obs[1], bt.obs[0].length, { color: P.data, width: 2.4, alpha: a, halo: 'rgba(255,255,255,.9)' });
      aObs = 1; aRef = 1;
      caption('LEAP learns the path log ratio \\i{G}_{\\i{θ}}(\\i{Φ}; \\i{c}) from complete paths.', '');
    } else {
      const u = t - STAGES[2].t0;
      if (u > 0.8 && u < 5) {
        const iters = Math.max(1, Math.round(1 + 10 * smooth((u - 0.8) / 3)));
        TL.descend(rep, iters, opt);
        repXY = toXY(rep);
      }
      const g = smooth((u - 0.8) / 3.2);
      const d0 = toXY(repSeed);
      polyline(ctx, d0[0], d0[1], d0[0].length, { color: P.ref, width: 1.3, dash: [5, 3.5], alpha: 0.55 });
      polyline(ctx, repXY[0], repXY[1], repXY[0].length, { color: P.action[0], width: 1.6 + 1.2 * g, halo: 'rgba(255,255,255,.85)' });
      caption('Combining it with the reference action gives the learned action \\i{S}_{\\i{θ}}(\\i{Φ}; \\i{c}).',
        'Minimizing \\i{S}_{\\i{θ}} from a reference path that grazes the barrier lifts it onto the representative trajectory.');
    }
    tag(tagObs, X(0.36), Y(0.17), aObs * (s < 2 ? 1 : 0));
    tag(tagRef, X(0.66), Y(0.16), aRef * (s === 0 ? 1 : 0));
    dot(ctx, X(A[0]), Y(A[1]), 6.5, P.A, '#fff', 1.4);
    dot(ctx, X(B[0]), Y(B[1]), 6.5, P.B, '#fff', 1.4);
  }

  const clock = loop((dt) => {
    const prev = clockT;
    clockT += dt;
    if (clockT >= DUR) { clockT = 0; resetRep(); }
    if (prev < STAGES[2].t0 && clockT >= STAGES[2].t0) resetRep();
    draw();
  });
  playButton(document.getElementById('controls'), clock);
  const t0 = Fig.reduced ? 20 : Fig.query('t', 0);
  if (t0) {
    clockT = t0;
    if (t0 >= STAGES[2].t0) { for (let f = 0; f < Math.min(t0 - STAGES[2].t0 - 0.8, 4.2) * 60; f++) TL.descend(rep, 11, opt); repXY = toXY(rep); }
  }
  draw();
})();
</script>
</body>
</html>
