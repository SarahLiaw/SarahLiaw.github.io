<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Log Ratio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans|Castoro">
<link rel="stylesheet" href="../css/fig.css">
<style>
  /* the right panel's axis reaches the bottom-right corner, so the control sits top-right here */
  .controls { top: 10px; bottom: auto; }
  @media (max-width: 600px) { .controls { top: 4px; bottom: auto; transform-origin: top right; } }
</style>
</head>
<body>
<main id="fig" role="img" aria-label="Orbital path log ratio. The left panel shows the inner planets of one held out path of the 31 body system over 32 days. The middle panel shows the running path summary of every held out path, which drifts upward for observed paths with z = +1, downward for observed paths with z = −1 and stays near zero for reference paths. The right panel shows learned path log ratios against the same path summary, where LEAP-Global follows the exact log cosh A curve and LEAP-Local stays in a narrow band."></main>
<div class="controls" id="controls"></div>
<script src="../js/fig.js"></script>
<script src="../data/orbital.js"></script>
<script>
(() => {
  'use strict';
  const { P, rich, setRich, stage, polyline, dot, axes, legend, loop, playButton, smooth } = Fig;
  const O = window.LEAP_ORBITAL;
  const W = 1000, H = 545;
  const host = document.getElementById('fig');
  const st = stage(host, W, H, () => draw());
  const svg = st.svg;
  const GROUP = ['#868d97', P.regimeHi, P.regimeLo];          // reference, z = +1, z = -1
  const DAYS = 32, TRAVEL = 8, HOLD = 3, DUR = TRAVEL + HOLD;
  const AL = [-7.6, 7.6], AT = [-6, -3, 0, 3, 6];

  const VIDEO = Fig.query('video', 0) === 1;      // ?video=1: short captions for social clips
  if (VIDEO) {
    rich(svg, 16, 30, 'A hidden change in the Sun\u2019s mass builds up over the whole orbit.', { class: 'cap cap-em' }).style.fontSize = '24px';
    rich(svg, 16, 58, 'LEAP-Global scores the whole path at once and follows the exact log ratio.', { class: 'cap' }).style.fontSize = '19px';
    document.getElementById('controls').style.display = 'none';
  } else rich(svg, 16, 32, 'The hidden \\i{z} acts on every step, so the path log ratio depends on the whole path through \\i{A}.', { class: 'cap cap-em' });

  // Left: inner planets of the highlighted held out path (heliocentric, Earth's orbital plane).
  const SS = { cx: 120, cy: 290, s: 85 };       // pixels per AU
  const PLANETS = { mercury: 'Mercury', venus: 'Venus', earth: 'Earth' };
  rich(svg, 22, 80, '31 body system', { class: 'sub' });
  rich(svg, 22, 104, 'solar mass \\i{m}_{⊙}(1 + \\i{zη})', { class: 'tick' });
  const dayText = rich(svg, SS.cx, 430, '', { class: 'tick', 'text-anchor': 'middle' });
  for (const k in PLANETS) {
    const low = O.planets[k].orbit.reduce((m, q) => (q[1] < m[1] ? q : m));
    rich(svg, SS.cx + low[0] * SS.s, SS.cy - low[1] * SS.s + 15, PLANETS[k], { class: 'tick', 'text-anchor': 'middle', fill: '#8a919c' });
  }

  // Middle: running path summary A_t of all 384 held out candidates; right: their learned log ratios against A.
  const C2 = { x: 300, y: 96, w: 285, h: 372 }, C3 = { x: 650, y: 96, w: 310, h: 372 };
  const ax2 = axes(st.bg, { ...C2, xlim: [0, DAYS], ylim: AL, xticks: [0, 8, 16, 24, 32], yticks: AT,
    xlabel: 'Day', ylabel: 'Path summary \\i{A}_{\\i{t}}', ylabelGap: 40 });
  const ax3 = axes(st.bg, { ...C3, xlim: [-0.5, 7.5], ylim: AL, xticks: [0, 2, 4, 6], ygrid: AT, xlabel: 'Path log ratio (nats)' });
  rich(svg, C2.x, 80, 'Each day adds \\i{d}_{\\i{k}} to \\i{A}_{\\i{t}}', { class: 'sub' });
  rich(svg, C3.x, 80, 'Learned and exact log ratios', { class: 'sub' });
  legend(svg, C2.x + 12, C2.y + 20, [['line', GROUP[1], 'observed, \\i{z} = +1'], ['line', GROUP[2], 'observed, \\i{z} = −1'],
    ['line', GROUP[0], 'reference'], ['thick', GROUP[1], 'shown path']], { vertical: true, lineHeight: 21 });
  legend(svg, ax3.sx(3.0), ax3.sy(1.3), [['dash', P.exact, 'Exact, log cosh \\i{A}'], ['dot', P.leap, 'LEAP-Global'], ['square', P.local, 'LEAP-Local']],
    { vertical: true, lineHeight: 22 });

  const At = O.At, grp = O.group, shown = O.A_t_shown;
  const at = (a, day) => { const i = Math.min(Math.floor(day), DAYS - 1), f = day - i; return a[i] + (a[i + 1] - a[i]) * f; };
  const px = ([x, y]) => [SS.cx + x * SS.s, SS.cy - y * SS.s];
  const exact = []; for (let i = 0; i <= 240; i++) exact.push(AL[0] + (AL[1] - AL[0]) * i / 240);
  let t = 0;

  function draw() {
    const ctx = st.ctx;
    st.clear();
    const day = DAYS * smooth(Math.min(t, TRAVEL) / TRAVEL), n = Math.floor(day);

    for (const k in PLANETS) {
      const pl = O.planets[k], mer = k === 'mercury';
      polyline(ctx, pl.orbit.map((q) => px(q)[0]), pl.orbit.map((q) => px(q)[1]), pl.orbit.length, { color: '#d3d7dd', width: 0.9 });
      const tx = [], ty = [];
      for (let i = 0; i <= n; i++) { const [a, c] = px(pl.path[i]); tx.push(a); ty.push(c); }
      const [cx, cy] = px([at(pl.path.map((q) => q[0]), day), at(pl.path.map((q) => q[1]), day)]);
      tx.push(cx); ty.push(cy);
      polyline(ctx, tx, ty, tx.length, { color: mer ? GROUP[1] : '#9aa1ab', width: mer ? 2.2 : 1.5 });
      dot(ctx, cx, cy, mer ? 3.8 : 4.4, mer ? GROUP[1] : '#7d8590', '#fff', 1);
    }
    dot(ctx, SS.cx, SS.cy, 8, '#e8a33d', '#fff', 1.2);
    setRich(dayText, 'day ' + n + ' of 32');

    // observed paths first, the reference band over them, then the shown path on top
    ctx.save(); ctx.beginPath(); ctx.rect(C2.x, C2.y, C2.w, C2.h); ctx.clip();
    ctx.lineWidth = 0.8; ctx.lineJoin = 'round';
    for (const g of [2, 1, 0]) {
      ctx.strokeStyle = GROUP[g]; ctx.globalAlpha = g ? 0.32 : 0.26;
      for (let i = 0; i < At.length; i++) {
        if (grp[i] !== g || i === O.shown) continue;
        const a = At[i];
        ctx.beginPath(); ctx.moveTo(ax2.sx(0), ax2.sy(0));
        for (let k = 1; k <= n; k++) ctx.lineTo(ax2.sx(k), ax2.sy(a[k]));
        if (day > n) ctx.lineTo(ax2.sx(day), ax2.sy(at(a, day)));
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    const aNow = at(shown, day), xs = [], ys = [];
    for (let k = 0; k <= n; k++) { xs.push(ax2.sx(k)); ys.push(ax2.sy(shown[k])); }
    if (day > n) { xs.push(ax2.sx(day)); ys.push(ax2.sy(aNow)); }
    polyline(ctx, xs, ys, xs.length, { color: GROUP[1], width: 2.4, halo: '#fff', haloWidth: 2.4 });
    ctx.restore();

    ctx.save(); ctx.beginPath(); ctx.rect(C3.x, C3.y, C3.w, C3.h); ctx.clip();
    ctx.globalAlpha = 0.45; ctx.fillStyle = P.local;
    for (let i = 0; i < O.A.length; i++) ctx.fillRect(ax3.sx(O.local[i]) - 2.4, ax3.sy(O.A[i]) - 2.4, 4.8, 4.8);
    ctx.globalAlpha = 0.75;
    for (let i = 0; i < O.A.length; i++) dot(ctx, ax3.sx(O.global[i]), ax3.sy(O.A[i]), 2.8, P.leap);
    ctx.globalAlpha = 1;
    polyline(ctx, exact.map((a) => ax3.sx(Math.log(Math.cosh(a)))), exact.map((a) => ax3.sy(a)), exact.length,
      { color: P.exact, width: 1.5, dash: [6, 3.5] });
    ctx.restore();

    // the shown path's current A_t, carried across to the exact curve
    const hx = ax2.sx(day), hy = ax2.sy(aNow), mx = ax3.sx(Math.log(Math.cosh(aNow)));
    polyline(ctx, [hx, mx], [hy, hy], 2, { color: '#a99bc9', width: 1, dash: [2, 3.5] });
    dot(ctx, hx, hy, 3.6, GROUP[1], '#fff', 1.2);
    dot(ctx, mx, hy, 6.5, '#fff', GROUP[1], 2.2);
  }

  const clock = loop((dt) => { t += dt; if (t > DUR) t = 0; draw(); });
  playButton(document.getElementById('controls'), clock);
  t = Fig.reduced ? TRAVEL : Fig.query('t', 0);
  draw();
})();
</script>
</body>
</html>
